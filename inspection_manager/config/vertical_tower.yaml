inspection_manager:
  ros__parameters:
    frame_id: map
    scan_mode: vertical_tower
    # The first tower in px4_inspection.world is centred at (0, 0).
    tower_center_x: 0.0
    tower_center_y: 0.0
    z_min: 1.5
    z_max: 9.5
    orbit_radius: 4.0
    minimum_orbit_radius: 3.0
    tower_surface_standoff: 2.0
    tower_base_clearance: 1.5
    tower_top_clearance: 1.0
    tower_observation_timeout: 2.0
    orbit_count: 2.0
    orbit_samples_per_turn: 72
    orbit_start_angle: 0.0
    # Synthetic/real perception x/y becomes the orbit centre after the gate.
    use_observation_center: true
    # The bridge path timeout is 0.5 s, so publish at least 5 Hz.
    publish_rate: 5.0
    require_observation: true
